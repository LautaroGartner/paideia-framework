<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Building Paideia - Lautaro Gärtner</title>
    <meta name="description" content="Why I started building Paideia Framework.">
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f6f2;
        color: #191816;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
      }

      .shell {
        width: min(760px, calc(100vw - 40px));
        margin: 0 auto;
        padding: 42px 0 72px;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        border-bottom: 1px solid #dedbd2;
        padding-bottom: 18px;
      }

      header a,
      nav a {
        color: inherit;
        font-size: 0.92rem;
        font-weight: 700;
        text-decoration: none;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
      }

      nav a {
        color: #5f5a50;
        font-weight: 650;
      }

      main {
        padding-top: 78px;
      }

      time {
        color: #716b61;
        font-size: 0.92rem;
      }

      h1 {
        margin: 14px 0 0;
        max-width: 680px;
        font-size: clamp(2.4rem, 7vw, 4.7rem);
        line-height: 0.96;
        letter-spacing: 0;
      }

      .description {
        max-width: 620px;
        margin: 24px 0 0;
        color: #4f4a43;
        font-size: 1.15rem;
        line-height: 1.7;
      }

      .post-body {
        margin-top: 50px;
      }

      .post-body p {
        max-width: 640px;
        margin: 0 0 24px;
        color: #292622;
        font-size: 1.1rem;
        line-height: 1.8;
      }

      footer {
        margin-top: 92px;
        border-top: 1px solid #dedbd2;
        padding-top: 18px;
        color: #716b61;
        font-size: 0.88rem;
      }

      @media (max-width: 640px) {
        .shell {
          width: min(100vw - 28px, 760px);
          padding-top: 26px;
        }

        header {
          align-items: flex-start;
          flex-direction: column;
        }

        main {
          padding-top: 54px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <a href="/">Lautaro Gärtner</a>

        <nav aria-label="Site">
          <a href="/">Home</a>
          <a href="/writing">Writing</a>
        </nav>
      </header>
      <main>
        <time datetime="2026-05-20">2026-05-20</time>
        <h1>Building Paideia</h1>
        <p class="description">Why I started building Paideia Framework.</p>
        <div class="post-body">
          <p>Paideia began as an experiment around inspectable runtimes, minimal software systems, and explicit contracts.</p>
        </div>
      </main>
      <footer>Generated by Paideia Framework v1.5.0-alpha.3.</footer>
    </div>
  </body>
</html>
