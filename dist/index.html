
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Lead · Paideia Framework</title>

    <style>
      :root {
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;

        background: #fafafa;
        color: #0a0a0a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, rgba(99, 102, 241, 0.08), transparent 28rem),
          radial-gradient(circle at top right, rgba(14, 165, 233, 0.08), transparent 24rem),
          #fafafa;
        color: #0a0a0a;
      }

      main {
        width: min(980px, calc(100% - 40px));
        margin: 0 auto;
        padding: 72px 0 120px;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 24px;
        margin-bottom: 56px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .mark {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: #0a0a0a;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 1.1rem;
        letter-spacing: -0.03em;
        font-weight: 720;
      }

      .version {
        border: 1px solid #e5e5e5;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.72);
        color: #737373;
        padding: 6px 10px;
        font-size: 0.78rem;
        font-weight: 600;
      }

      .intro {
        margin-bottom: 44px;
      }

      .intro h2 {
        max-width: 680px;
        font-size: clamp(2.2rem, 6vw, 4.6rem);
        line-height: 0.98;
        letter-spacing: -0.075em;
        font-weight: 760;
      }

      .intro p {
        max-width: 560px;
        margin-top: 18px;
        color: #525252;
        font-size: 1.02rem;
        line-height: 1.7;
      }

      .layout {
        display: grid;
        gap: 24px;
      }

      .panel {
        display: grid;
        gap: 22px;
        border: 1px solid #e5e5e5;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.82);
        padding: 26px;
        box-shadow:
          0 1px 1px rgba(0, 0, 0, 0.02),
          0 24px 80px rgba(0, 0, 0, 0.04);
        backdrop-filter: blur(12px);
      }

      .panel h2 {
        color: #171717;
        font-size: 0.94rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .panel-heading {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 16px;
      }

      .panel-heading span {
        color: #737373;
        font-size: 0.82rem;
        font-weight: 560;
      }

      form {
        display: grid;
        gap: 17px;
      }

      .field {
        display: grid;
        gap: 7px;
      }

      label {
        color: #404040;
        font-size: 0.86rem;
        font-weight: 600;
      }

      .required {
        color: #e11d48;
      }

      input,
      select {
        width: 100%;
        border: 1px solid #d4d4d4;
        border-radius: 10px;
        background: #ffffff;
        color: #0a0a0a;
        padding: 11px 12px;
        font: inherit;
        outline: none;
        transition:
          border-color 120ms ease,
          box-shadow 120ms ease;
      }

      input:focus,
      select:focus {
        border-color: #0a0a0a;
        box-shadow: 0 0 0 4px rgba(10, 10, 10, 0.06);
      }

      input[aria-invalid="true"],
      select[aria-invalid="true"] {
        border-color: #e11d48;
        box-shadow: 0 0 0 4px rgba(225, 29, 72, 0.08);
      }

      .field-error {
        color: #be123c;
        font-size: 0.82rem;
        line-height: 1.45;
      }

      .form-summary {
        border: 1px solid #fecdd3;
        border-left: 3px solid #e11d48;
        border-radius: 12px;
        background: #fff1f2;
        color: #9f1239;
        padding: 13px 14px;
        font-size: 0.88rem;
        line-height: 1.5;
      }

      .form-summary p {
        margin-top: 6px;
      }

      .form-summary ul {
        margin: 6px 0 0;
        padding-left: 18px;
      }

      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 4px;
      }

      .record-actions {
        display: inline-flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        min-width: max-content;
      }

      .record-actions .button {
        white-space: nowrap;
      }

      .button,
      button {
        border: 1px solid transparent;
        border-radius: 10px;
        padding: 10px 13px;
        font: inherit;
        font-size: 0.9rem;
        font-weight: 660;
        cursor: pointer;
        transition:
          transform 120ms ease,
          background 120ms ease,
          border-color 120ms ease,
          opacity 120ms ease;
      }

      .button:hover,
      button:hover {
        transform: translateY(-1px);
      }

      .primary {
        background: #0a0a0a;
        color: #ffffff;
      }

      .secondary {
        border-color: #d4d4d4;
        background: #ffffff;
        color: #171717;
      }

      .danger {
        border-color: #fecdd3;
        background: #fff1f2;
        color: #be123c;
      }

      .danger:hover {
        border-color: #fda4af;
        background: #ffe4e6;
      }

      .tiny {
        padding: 6px 9px;
        font-size: 0.78rem;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        border-bottom: 1px solid #e5e5e5;
        padding: 13px 0;
        text-align: left;
        vertical-align: middle;
      }

      th {
        color: #737373;
        font-size: 0.72rem;
        font-weight: 720;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      td {
        color: #171717;
        font-size: 0.92rem;
      }

      th:not(:last-child),
      td:not(:last-child) {
        padding-right: 24px;
      }

      th:last-child,
      td:last-child {
        width: 1%;
        white-space: nowrap;
      }

      .ai-summary-cell {
        max-width: 280px;
        color: #525252;
        font-size: 0.82rem;
        line-height: 1.45;
        white-space: pre-wrap;
      }

      .ai-summary-cell:not(:empty)::before {
        content: "generated";
        display: block;
        width: fit-content;
        margin-bottom: 6px;
        border: 1px solid #d4d4d4;
        border-radius: 999px;
        padding: 2px 7px;
        color: #737373;
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .empty {
        color: #737373;
      }




      @media (max-width: 680px) {
        main {
          width: min(100% - 24px, 980px);
          padding-top: 42px;
        }

        header {
          margin-bottom: 38px;
        }

        .intro {
          margin-bottom: 32px;
        }

        .intro h2 {
          font-size: 2.4rem;
        }

        .panel {
          padding: 20px;
          border-radius: 16px;
        }

        th,
        td {
          white-space: nowrap;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <header>
        <div class="brand">
          <div class="mark" aria-hidden="true"></div>
          <h1>Paideia Framework</h1>
        </div>

        <p class="version">v1.2.0</p>
      </header>

      <section class="intro">
        <h2>Lead</h2>
        <p>A small generated interface for creating, validating, and storing records.</p>
      </section>

      
    <main class="layout">
      
    <section class="panel" data-paideia-section="form">
      <h2>Create</h2>

      <div id="lead-form-summary" class="form-summary" hidden></div>

      <form id="lead-form" novalidate>
        
        <div class="field">
          <label for="lead-name">
            Name <span class="required">*</span>
          </label>

          <input
            id="lead-name"
            name="name"
            type="text"
            aria-describedby="lead-name-error"
            
          />

          <p
            id="lead-name-error"
            class="field-error"
            data-error-for="name"
            hidden
          ></p>
        </div>
      
        <div class="field">
          <label for="lead-email">
            Email <span class="required">*</span>
          </label>

          <input
            id="lead-email"
            name="email"
            type="email"
            aria-describedby="lead-email-error"
            
          />

          <p
            id="lead-email-error"
            class="field-error"
            data-error-for="email"
            hidden
          ></p>
        </div>
      
          <div class="field">
            <label for="lead-status">
              Status <span class="required">*</span>
            </label>

            <select
              id="lead-status"
              name="status"
              aria-describedby="lead-status-error"
            >
              <option value="">Select</option>
              
                    <option value="new">new</option>
                  
                    <option value="contacted">contacted</option>
                  
                    <option value="closed">closed</option>
                  
            </select>

            <p
              id="lead-status-error"
              class="field-error"
              data-error-for="status"
              hidden
            ></p>
          </div>
        
        <div class="field">
          <label for="lead-notes">
            Notes 
          </label>

          <input
            id="lead-notes"
            name="notes"
            type="text"
            aria-describedby="lead-notes-error"
            
          />

          <p
            id="lead-notes-error"
            class="field-error"
            data-error-for="notes"
            hidden
          ></p>
        </div>
      

        <div class="actions">
          <button type="submit" class="button primary">
            Save
          </button>
        </div>
      </form>
    </section>
  

    <section class="panel" data-paideia-section="table">
      <div class="panel-heading">
        <h2>Records</h2>
        <span>Stored locally in this browser.</span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th><th>Email</th><th>Status</th><th>Notes</th>
              <th>AI Summary</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="lead-table-body">
            <tr>
              <td colspan="6" class="empty">
                No records.
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="actions">
        <button
          type="button"
          id="lead-clear-table-records"
          class="button danger"
        >
          Clear saved records
        </button>
      </div>
    </section>
  
    </main>
  
    </main>

    
    
    <script>
      (function () {
        const resourceName = "Lead";
        const resourceSlug = "lead";
        const schema = {
  "name": {
    "type": "string",
    "label": "Name",
    "required": true,
    "minLength": 2
  },
  "email": {
    "type": "email",
    "label": "Email",
    "required": true
  },
  "status": {
    "type": "select",
    "label": "Status",
    "options": [
      "new",
      "contacted",
      "closed"
    ],
    "required": true
  },
  "notes": {
    "type": "string",
    "label": "Notes"
  }
};
        const actions = [
  {
    "name": "markContacted",
    "label": "Mark contacted",
    "type": "update",
    "set": {
      "status": "contacted"
    },
    "log": "Lead was marked as contacted."
  },
  {
    "name": "summarize",
    "label": "Summarize",
    "type": "ai",
    "capability": "summarizeRecord",
    "log": "AI summary generated for one Lead record."
  },
  {
    "name": "close",
    "label": "Close",
    "type": "update",
    "set": {
      "status": "closed"
    },
    "log": "Lead was closed."
  }
];
        const permissions = {
  "create": "public",
  "update": "public",
  "delete": "admin",
  "ai": "authenticated"
};
        const storageKind = "local";
        const runtimeTarget = "browser";
        const api = {
  "enabled": false,
  "resource": "lead",
  "routes": [
    {
      "method": "GET",
      "path": "/api/leads",
      "capability": "record.read"
    },
    {
      "method": "POST",
      "path": "/api/leads",
      "capability": "record.create"
    },
    {
      "method": "PATCH",
      "path": "/api/leads/:id",
      "capability": "record.update"
    },
    {
      "method": "DELETE",
      "path": "/api/leads/:id",
      "capability": "record.delete"
    }
  ]
};

        const currentPermissionLevel = "public";

        const permissionRank = {
          public: 0,
          authenticated: 1,
          admin: 2,
        };

        function canAccess(requiredPermission) {
          return (
            permissionRank[currentPermissionLevel] >=
            permissionRank[requiredPermission]
          );
        }

        function getPermissionForAction(action) {
          if (action.type === "ai") {
            return permissions.ai;
          }

          if (action.type === "update") {
            return permissions.update;
          }

          return "admin";
        }

        const recordsStorageKey = "paideia:" + resourceSlug + ":records";
        

        const form = document.getElementById(resourceSlug + "-form");
        const tableBody = document.getElementById(resourceSlug + "-table-body");
        const formSummary = document.getElementById(resourceSlug + "-form-summary");
        const clearRecordsButton = document.getElementById(resourceSlug + "-clear-records");
        const clearTableRecordsButton = document.getElementById(resourceSlug + "-clear-table-records");
        

        const fieldNames = Object.keys(schema);
        const hasAiSummaryColumn = actions.some(function (action) {
          return (
            action.type === "ai" &&
            action.capability === "summarizeRecord"
          );
        });

        function escapeHtml(value) {
          return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
        }

        function humanize(fieldName) {
          return fieldName
            .replace(/([A-Z])/g, " $1")
            .replace(/[-_]/g, " ")
            .replace(/\b\w/g, function (letter) {
              return letter.toUpperCase();
            })
            .trim();
        }

        function getFieldLabel(fieldName) {
          return schema[fieldName].label || humanize(fieldName);
        }

        function createId() {
          if (window.crypto && window.crypto.randomUUID) {
            return window.crypto.randomUUID();
          }

          return String(Date.now()) + "-" + Math.random().toString(16).slice(2);
        }

        function createStorageAdapter(kind) {
          if (kind !== "local") {
            throw new Error("Unsupported storage adapter: " + kind);
          }

          return {
            load(key) {
              const raw = localStorage.getItem(key);

              if (!raw) return [];

              try {
                const parsed = JSON.parse(raw);
                return Array.isArray(parsed) ? parsed : [];
              } catch {
                return [];
              }
            },

            save(key, records) {
              localStorage.setItem(key, JSON.stringify(records));
            },
          };
        }

        const storage = createStorageAdapter(storageKind);

        const runtimeListeners = {};

        function onRuntimeEvent(eventName, handler) {
          if (!runtimeListeners[eventName]) {
            runtimeListeners[eventName] = [];
          }

          runtimeListeners[eventName].push(handler);
        }

        function emitRuntimeEvent(eventName, payload) {
          const listeners = runtimeListeners[eventName] || [];

          listeners.forEach(function (handler) {
            handler(payload);
          });

          
        }

        

        

        function loadRecords() {
          return storage.load(recordsStorageKey);
        }

        function saveRecords(records) {
          storage.save(recordsStorageKey, records);
        }

        

        function collectFormValues() {
          const values = {};

          fieldNames.forEach(function (fieldName) {
            const input = form.elements[fieldName];
            values[fieldName] = input ? input.value : "";
          });

          return values;
        }

        function validateRecord(values) {
          const errors = [];

          fieldNames.forEach(function (fieldName) {
            const field = schema[fieldName];
            const rawValue = values[fieldName] || "";
            const value = String(rawValue).trim();
            const label = getFieldLabel(fieldName);

            if (field.required && value === "") {
              errors.push({
                field: fieldName,
                label,
                message: label + " is required.",
              });

              return;
            }

            if (value === "") return;

            if (field.type === "email") {
              const emailLooksValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);

              if (!emailLooksValid) {
                errors.push({
                  field: fieldName,
                  label,
                  message: label + " must be a valid email address.",
                });
              }
            }

            if (field.type === "number") {
              const numberValue = Number(value);

              if (!Number.isFinite(numberValue)) {
                errors.push({
                  field: fieldName,
                  label,
                  message: label + " must be a valid number.",
                });
              }
            }

            if (
              typeof field.minLength === "number" &&
              value.length < field.minLength
            ) {
              errors.push({
                field: fieldName,
                label,
                message: label + " must be at least " + field.minLength + " characters.",
              });
            }

            if (
              typeof field.maxLength === "number" &&
              value.length > field.maxLength
            ) {
              errors.push({
                field: fieldName,
                label,
                message: label + " must be less than " + field.maxLength + " characters.",
              });
            }

            if (field.type === "select" && Array.isArray(field.options)) {
              if (!field.options.includes(value)) {
                errors.push({
                  field: fieldName,
                  label,
                  message: label + " must be one of: " + field.options.join(", ") + ".",
                });
              }
            }
          });

          return {
            valid: errors.length === 0,
            errors,
          };
        }

        function clearValidationUi() {
          if (formSummary) {
            formSummary.hidden = true;
            formSummary.innerHTML = "";
          }

          document.querySelectorAll("[data-error-for]").forEach(function (errorElement) {
            errorElement.hidden = true;
            errorElement.textContent = "";
          });

          fieldNames.forEach(function (fieldName) {
            const input = form.elements[fieldName];

            if (input) {
              input.removeAttribute("aria-invalid");
            }
          });
        }

        function renderValidationErrors(errors) {
          if (formSummary) {
            formSummary.hidden = false;

            formSummary.innerHTML =
              '<strong>' + escapeHtml(resourceName) + ' could not be saved.</strong>' +
              '<p>Fix these fields:</p>' +
              '<ul>' +
                errors
                  .map(function (error) {
                    return '<li>' + escapeHtml(error.message) + '</li>';
                  })
                  .join("") +
              '</ul>';
          }

          errors.forEach(function (error) {
            const errorElement = document.querySelector('[data-error-for="' + error.field + '"]');
            const input = form.elements[error.field];

            if (errorElement) {
              errorElement.hidden = false;
              errorElement.textContent = error.message;
            }

            if (input) {
              input.setAttribute("aria-invalid", "true");
            }
          });

          const firstError = errors[0];

          if (firstError && form.elements[firstError.field]) {
            form.elements[firstError.field].focus();
          }
        }

        function getActionByName(actionName) {
          return actions.find(function (action) {
            return action.name === actionName;
          });
        }

        function generateAiSummary(record) {
          const name = record.name || "This lead";
          const status = record.status || "unknown";
          const notes = record.notes || "";

          let suggestedAction = "Review this lead and decide the next step.";

          if (status === "new") {
            suggestedAction = "Suggested next action: reach out and start the conversation.";
          }

          if (status === "contacted") {
            suggestedAction = "Suggested next action: follow up or move toward closing.";
          }

          if (status === "closed") {
            suggestedAction = "Suggested next action: archive or keep for reporting.";
          }

          const notesSummary = notes
            ? "Notes: " + notes
            : "Notes: no extra context provided.";

          return (
            "Lead summary:\n" +
            name +
            " is currently marked as " +
            status +
            ".\n" +
            notesSummary +
            "\n" +
            suggestedAction
          );
        }

        function applyAiAction(record, action) {
          if (action.capability !== "summarizeRecord") {
            return record;
          }

          const summary = generateAiSummary(record);

          emitRuntimeEvent("ai.executed", {
            action,
            summary,
          });

          return {
            ...record,
            _ai: {
              ...(record._ai || {}),
              summary,
              updatedAt: new Date().toISOString(),
            },
          };
        }

        function applyUpdateAction(record, action) {
          return {
            ...record,
            ...action.set,
            updatedAt: new Date().toISOString(),
          };
        }

        function renderActionButtons(recordIndex) {
          const customActions = actions
            .map(function (action) {
              const buttonClass =
                action.type === "ai"
                  ? "button primary tiny"
                  : "button secondary tiny";

              return (
                '<button type="button" class="' +
                  buttonClass +
                  '" data-action-name="' +
                  escapeHtml(action.name) +
                  '" data-action-index="' +
                  recordIndex +
                '">' +
                  escapeHtml(action.label) +
                '</button>'
              );
            })
            .join("");

          return (
            '<div class="record-actions">' +
              customActions +
              '<button type="button" class="button danger tiny" data-delete-index="' + recordIndex + '">' +
                'Delete' +
              '</button>' +
            '</div>'
          );
        }

        function renderRecords() {
          const records = loadRecords();

          if (!tableBody) return;

          const extraAiColumnCount = hasAiSummaryColumn ? 1 : 0;

          if (records.length === 0) {
            tableBody.innerHTML =
              '<tr>' +
                '<td colspan="' + (fieldNames.length + extraAiColumnCount + 1) + '" class="empty">' +
                  'No records.' +
                '</td>' +
              '</tr>';

            return;
          }

          tableBody.innerHTML = records
            .map(function (record, index) {
              const cells = fieldNames
                .map(function (fieldName) {
                  return '<td>' + escapeHtml(record[fieldName] ?? "") + '</td>';
                })
                .join("");

              const aiSummaryCell = hasAiSummaryColumn
                ? (
                    '<td class="ai-summary-cell">' +
                      escapeHtml(
                        record._ai && record._ai.summary
                          ? record._ai.summary
                          : ""
                      ) +
                    '</td>'
                  )
                : "";

              return (
                '<tr>' +
                  cells +
                  aiSummaryCell +
                  '<td>' +
                    renderActionButtons(index) +
                  '</td>' +
                '</tr>'
              );
            })
            .join("");
        }

        if (form) {
          form.addEventListener("submit", function (event) {
            event.preventDefault();

            if (!canAccess(permissions.create)) {
              emitRuntimeEvent("permission.denied", {
                operation: "create",
                requiredPermission: permissions.create,
                currentPermission: currentPermissionLevel,
              });

              return;
            }

            clearValidationUi();

            const values = collectFormValues();
            const result = validateRecord(values);

            if (!result.valid) {
              const errorMessage =
                resourceName + " could not be saved.\n" +
                result.errors
                  .map(function (error) {
                    return "- " + error.message;
                  })
                  .join("\n");

              renderValidationErrors(result.errors);
              emitRuntimeEvent("validation.failed", {
                message: errorMessage,
              });

              return;
            }

            const records = loadRecords();

            const nextRecord = {
              id: createId(),
              createdAt: new Date().toISOString(),
              ...values,
            };

            saveRecords([...records, nextRecord]);

            form.reset();
            clearValidationUi();
            renderRecords();

            
            emitRuntimeEvent("record.created", {
              record: nextRecord,
            });
            
          });
        }

        if (tableBody) {
          tableBody.addEventListener("click", function (event) {
            const actionButton = event.target.closest("[data-action-name]");
            const deleteButton = event.target.closest("[data-delete-index]");

            if (actionButton) {
              const actionName = actionButton.getAttribute("data-action-name");
              const index = Number(actionButton.getAttribute("data-action-index"));
              const action = getActionByName(actionName);
              const records = loadRecords();

              if (!action || !Number.isInteger(index) || !records[index]) {
                return;
              }

              const requiredPermission = getPermissionForAction(action);

              if (!canAccess(requiredPermission)) {
                emitRuntimeEvent("permission.denied", {
                  operation: action.name,
                  requiredPermission,
                  currentPermission: currentPermissionLevel,
                });

                return;
              }

              if (action.type === "ai") {
                const nextRecords = records.map(function (record, recordIndex) {
                  if (recordIndex !== index) {
                    return record;
                  }

                  return applyAiAction(record, action);
                });

                saveRecords(nextRecords);
                renderRecords();
                

                return;
              }

              if (action.type === "update") {
                const nextRecords = records.map(function (record, recordIndex) {
                  if (recordIndex !== index) {
                    return record;
                  }

                  return applyUpdateAction(record, action);
                });

                saveRecords(nextRecords);
                renderRecords();

                emitRuntimeEvent("action.executed", {
                  action,
                  name: action.name,
                  label: action.label,
                  log: action.log,
                });
                

                return;
              }
            }

            if (deleteButton) {
              const index = Number(deleteButton.getAttribute("data-delete-index"));
              const records = loadRecords();

              if (!Number.isInteger(index) || !records[index]) {
                return;
              }

              if (!canAccess(permissions.delete)) {
                emitRuntimeEvent("permission.denied", {
                  operation: "delete",
                  requiredPermission: permissions.delete,
                  currentPermission: currentPermissionLevel,
                });

                return;
              }

              const nextRecords = records.filter(function (_, recordIndex) {
                return recordIndex !== index;
              });

              saveRecords(nextRecords);
              renderRecords();

              emitRuntimeEvent("record.deleted", {
                index,
              });
              
            }
          });
        }

        function clearRecords() {
            if (!canAccess(permissions.delete)) {
              emitRuntimeEvent("permission.denied", {
                operation: "clear records",
                requiredPermission: permissions.delete,
                currentPermission: currentPermissionLevel,
              });

              return;
            }

            saveRecords([]);
            renderRecords();

            emitRuntimeEvent("records.cleared", {});
            
        }

        if (clearRecordsButton) {
          clearRecordsButton.addEventListener("click", clearRecords);
        }

        if (clearTableRecordsButton) {
          clearTableRecordsButton.addEventListener("click", clearRecords);
        }

        

        renderRecords();
        
      })();
    </script>
  
  </body>
</html>
