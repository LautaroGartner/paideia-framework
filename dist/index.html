<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lautaro Gärtner</title>
    <meta name="description" content="Personal site for Lautaro Gärtner and Paideia Framework.">
    <meta name="author" content="Lautaro Gärtner">
    <link rel="canonical" href="https://lautarogartner.com/">
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f6f2;
        color: #191816;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
      }

      .shell {
        width: min(760px, calc(100vw - 40px));
        margin: 0 auto;
        padding: 42px 0 72px;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        border-bottom: 1px solid #dedbd2;
        padding-bottom: 18px;
      }

      header a {
        color: inherit;
        font-size: 0.92rem;
        font-weight: 700;
        text-decoration: none;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
      }

      nav a {
        color: #5f5a50;
        font-weight: 650;
      }

      main {
        padding-top: 78px;
      }

      h1 {
        margin: 0;
        max-width: 680px;
        font-size: clamp(2.4rem, 7vw, 4.7rem);
        line-height: 0.96;
        letter-spacing: 0;
      }

      p {
        max-width: 620px;
        margin: 26px 0 0;
        color: #4f4a43;
        font-size: 1.15rem;
        line-height: 1.7;
      }

      .post-list {
        display: grid;
        gap: 22px;
        margin-top: 44px;
      }

      article {
        border-top: 1px solid #dedbd2;
        padding-top: 22px;
      }

      time {
        color: #716b61;
        font-size: 0.88rem;
      }

      h2 {
        margin: 8px 0 0;
        font-size: 1.35rem;
        letter-spacing: 0;
      }

      h2 a {
        color: inherit;
        text-decoration: none;
      }

      article p {
        margin-top: 10px;
        font-size: 1rem;
      }

      footer {
        margin-top: 92px;
        border-top: 1px solid #dedbd2;
        padding-top: 18px;
        color: #716b61;
        font-size: 0.88rem;
      }

      @media (max-width: 640px) {
        .shell {
          width: min(100vw - 28px, 760px);
          padding-top: 26px;
        }

        header {
          align-items: flex-start;
          flex-direction: column;
        }

        main {
          padding-top: 54px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <a href="/">Lautaro Gärtner</a>

        <nav aria-label="Site">
          <a href="/">Home</a>
          <a href="/writing">Writing</a>
        </nav>
      </header>
      <main>
        <h1>Home</h1>
        <p>Building Paideia Framework in public.</p>

      </main>
      <footer>Generated by Paideia Framework v1.5.0-beta.1.</footer>
    </div>
  </body>
</html>
