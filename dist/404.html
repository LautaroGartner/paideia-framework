<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found - Lautaro Gärtner&#039;s blog</title>
    <meta name="description" content="The requested page could not be found.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta name="author" content="Lautaro Gärtner">
    <link rel="canonical" href="https://lautarogartner.com/404">
    <style>
      :root {
        --accent: #5f6f52;
        --bg: #fbfaf7;
        --line: #e8e2d8;
        --muted: #6f6a61;
        --text: #151515;

        color-scheme: light dark;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;

        background: var(--bg);
        color: var(--text);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --accent: #a7b995;
          --bg: #181815;
          --line: #303026;
          --muted: #9b958a;
          --text: #eeeae2;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
      }

      .shell {
        width: min(760px, calc(100vw - 40px));
        margin: 0 auto;
        padding: 1.5rem 0 4rem;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 2.5rem;
        padding-bottom: 10px;
      }

      header a,
      header .brand,
      nav a {
        color: inherit;
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
      }

      nav a {
        color: var(--muted);
        font-weight: 500;
      }

      main {
        padding-top: 0;
      }

      h1 {
        margin: 0;
        max-width: 680px;
        font-size: clamp(1.8rem, 5vw, 3rem);
        line-height: 1;
        letter-spacing: 0;
      }

      p {
        max-width: 620px;
        margin: 18px 0 0;
        color: var(--text);
        font-size: 1rem;
        line-height: 1.7;
      }

      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        margin-top: 5.5rem;
        padding-top: 1rem;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.78rem;
      }

      footer a {
        color: inherit;
      }

      .generated-by {
        color: var(--muted);
      }

      @media (max-width: 640px) {
        .shell {
          width: min(100vw - 3rem, 42rem);
          padding-top: 1.5rem;
        }

        header {
          align-items: baseline;
          gap: 14px;
          margin-bottom: 2.5rem;
        }

        header a,
        header .brand {
          font-size: 1rem;
        }

        nav {
          gap: 24px;
        }

        nav a {
          font-size: 0.9rem;
        }

        main {
          padding-top: 0;
        }

        footer {
          justify-content: space-between;
          gap: 16px;
          margin-top: 96px;
          border-top: 0;
          padding-top: 0;
          font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
          font-size: 0.78rem;
        }

        .generated-by {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <a class="brand" href="/">Lautaro Gärtner</a>
        <nav aria-label="Site">
          <a href="/about">About</a>
          <a href="https://x.com/lautyxgr" rel="me">𝕏 Follow me</a>
        </nav>
      </header>
      <main>
        <h1>Page not found</h1>
        <p>The page you are looking for does not exist yet.</p>
      </main>
      <footer>
        <span>
          Lautaro Gärtner
          <a href="https://x.com/lautyxgr" rel="me">@lautyxgr</a>
        </span>
        
        <span class="generated-by">
          Generated by Paideia Framework v1.7.0.
        </span>
        <a href="https://github.com/LautaroGartner/paideia-framework">Source</a>
      </footer>
    </div>
  </body>
</html>
